workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Foolproof iOS Setup and Pod Install
        script: |
          set -e
          npm install
          
          # www klasörünün varlığını garanti ediyoruz
          if [ ! -d "www" ]; then
            mkdir -p www
            echo "<html><body>Game</body></html>" > www/index.html
          fi
          
          # Eğer ios klasörü yoksa sıfırdan ekliyoruz, varsa üzerine yazmıyoruz
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            npx cap sync ios
          fi
          
          # Podfile'ın nerede olduğunu dinamik olarak bulup garanti altına alıyoruz
          if [ -f "ios/App/Podfile" ]; then
            cd ios/App
          elif [ -f "ios/Podfile" ]; then
            cd ios
          else
            echo "Podfile bulunamadı, oluşturuluyor..."
            cd ios/App
          fi
          
          pod install
      - name: Build ipa
        script: |
          if [ -d "ios/App" ]; then
            cd ios/App
          elif [ -d "ios" ]; then
            cd ios
          fi
          
          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/
